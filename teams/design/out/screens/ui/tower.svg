    <g transform="translate(0 52)">
      <rect x="12" y="370" width="482" height="40" rx="10" class="card"/><text x="24" y="394" class="t" font-weight="600">총괄실 <tspan class="s" font-weight="400">단계 없음</tspan></text><circle cx="440" cy="390" r="6" fill="#1f5f4f"/><circle cx="460" cy="390" r="6" fill="#7a3b52"/><circle cx="480" cy="390" r="6" fill="#5f8fbf"/>
      <rect x="12" y="416" width="482" height="40" rx="10" class="card"/><text x="24" y="440" class="t" font-weight="600">마케팅팀 <tspan class="s" font-weight="400">1장 7단계 마을 브랜딩 · 30회차</tspan></text><rect x="300" y="437" width="100" height="5" rx="2.5" fill="#e6e0d3"/><rect x="300" y="437" width="86" height="5" rx="2.5" fill="#3a8f5c"/><text x="408" y="443" class="m">6/7</text><circle cx="440" cy="436" r="6" fill="#2f4f7a"/><circle cx="460" cy="436" r="6" fill="#a8541f"/><circle cx="480" cy="436" r="6" fill="#5b3a63"/>
      <rect x="12" y="462" width="482" height="40" rx="10" class="card"/><text x="24" y="486" class="t" font-weight="600">개발팀 <tspan class="s" font-weight="400">6단계 화면 새로 짜기 · 33회차</tspan></text><rect x="300" y="483" width="100" height="5" rx="2.5" fill="#e6e0d3"/><rect x="300" y="483" width="62" height="5" rx="2.5" fill="#3a8f5c"/><text x="408" y="489" class="m">5/8</text><circle cx="440" cy="482" r="6" fill="#4a5d3a"/><circle cx="460" cy="482" r="6" fill="#2f6b7a"/><circle cx="480" cy="482" r="6" fill="#9c3b2f"/>
      <!-- 펼친 줄 본보기 — 디자인팀을 누른 상태: 상황판 네 칸 그 자리에서 -->
      <rect x="12" y="508" width="482" height="118" rx="10" class="card" stroke="#1b1a1f" stroke-width="1.5"/><text x="24" y="532" class="t" font-weight="600">디자인팀 <tspan class="s" font-weight="400">4단계 화면 시안 · 16회차 · 검토 기다림</tspan></text><rect x="300" y="529" width="100" height="5" rx="2.5" fill="#e6e0d3"/><rect x="300" y="529" width="50" height="5" rx="2.5" fill="#3a8f5c"/><text x="408" y="535" class="m">3/6</text><circle cx="440" cy="528" r="6" fill="#4b5f9e"/><circle cx="460" cy="528" r="6" fill="#c96f3b"/><circle cx="480" cy="528" r="6" fill="#6b4a2f"/>
      <g class="s"><text x="24" y="556"><tspan class="k">하는 것</tspan>  헨리 관제탑 3판 · 클레멘타인 보고서·대시보드</text><text x="24" y="574"><tspan class="k">막힌 것</tspan>  <tspan fill="#c94a3a">외부 감사 계정 한도 — 4단계 검토</tspan></text><text x="24" y="592"><tspan class="k">대표님이 보실 것</tspan>  없어요</text><text x="24" y="610"><tspan class="k">다음</tspan>  현황 3판 → 검토 결과</text></g>
      <rect x="12" y="632" width="482" height="40" rx="10" class="card"/><text x="24" y="656" class="t" font-weight="600">경영팀 <tspan class="s" font-weight="400">단계 없음</tspan></text><circle cx="440" cy="652" r="6" fill="#6f9a4a"/><circle cx="460" cy="652" r="6" fill="#a8541f"/><circle cx="480" cy="652" r="6" fill="#5b3a63"/>
    </g>
    <!-- 읽는 법 -->
  </g>

  <!-- 읽는 법 — 주석. 프레임 밖(하영 5판 3-5-4: 화면 글자가 아니라 시안 메모). 테라가 지을 때 이 글자는 안 짓는다 -->
  <g class="s" transform="translate(24 1034)">
    <text x="0" y="0">읽는 법(시안 메모 — 화면 글자 아님) — 위에서 아래로 넷뿐: 막힌 것 → 한 것 → 대표님이 보실 것 → 팀. 없으면 그 칸이 사라진다. 막힌 것은 스크롤 없이.</text>
    <text x="0" y="18">팀 줄을 누르면 그 자리에서 펼쳐진다(상황판 네 칸, 글자 그대로). 한 번 더 누르면 카드 — 두 번이면 닿는다. 시계 없음 — 어제는 보고서.</text>
    <text x="0" y="36">사람 점 = 직책 색(마을 인형과 같은 색). 점 옆 작은 점: 초록 = 일하는 중 · 빨강 = 멈춤. 막힌 것의 빨간 띠 = 멈춘 시간(폰 1분 = 1px, 데스크톱 2분 = 1px).</text>
    <text x="0" y="54">숫자는 넷뿐 — 막힌 것 수 · 보실 것 수 · 단계 N/M · 회차. 발언 수·대화 수·검토 결과 수는 없다.</text>
    <text x="0" y="72">보실 것은 대표님이 정할 것(C)과 물어봄만 — 총괄이 보는 것(B)은 안 뜬다. 물어봄은 선택지가 곧 버튼. 누른 것은 "됐어요" 한 줄로 남는다.</text>
    <text x="0" y="90">왼쪽 폰 412 · 오른쪽 데스크톱 1200 폭(같은 칸 넷이 두 단으로). 탭 이름·직책은 결정 136 으로 확정(현황·총괄실). 시각은 우리 시각. 색은 임시(작전실 토큰으로). 피그마 허용 오면 옮긴다.</text>
  </g>
  <text x="988" y="1142" text-anchor="end" font-size="9" fill="#a8a6ae">현황 첫 화면 시안 3판 · 2026-09-14 · 헨리 · 나리 '화면이 답하는 질문' 순서 + 도면 1판 + 하영 낱말 2판 9절 · 결정 92·105·100·46·52</text>
</svg>
