    <text x="16" y="62" class="k">뭐가 막혔나 2</text>
    <rect x="12" y="70" width="236" height="50" rx="10" class="card"/><circle cx="28" cy="90" r="4" class="bad"/><text x="40" y="91" class="t" font-weight="600">디자인 · 마크</text><text x="40" y="106" class="s">외부 감사 계정 한도</text><rect x="152" y="101" width="40" height="5" rx="2.5" class="bad"/><text x="198" y="107" class="m">2시간째</text>
    <rect x="12" y="126" width="236" height="50" rx="10" class="card"/><circle cx="28" cy="146" r="4" class="bad"/><text x="40" y="147" class="t" font-weight="600">개발 · 테라</text><text x="40" y="162" class="s">유니티 그림 기다림</text><rect x="152" y="157" width="14" height="5" rx="2.5" class="bad"/><text x="198" y="163" class="m">40분째</text>
    <text x="16" y="206" class="k">대표님이 보실 것 2</text>
    <rect x="12" y="214" width="236" height="56" rx="10" class="card" stroke="#d8b25c" stroke-width="1.5"/><text x="24" y="234" class="t" font-weight="600">마케팅 · 하영 · 결재</text><text x="24" y="252" class="s">직책 열일곱 — 후보 고르기</text>
    <rect x="12" y="276" width="236" height="80" rx="10" class="card" stroke="#d8b25c" stroke-width="1.5"/><text x="24" y="296" class="t" font-weight="600">총괄실 · 세라 · 대표님께 물어봄</text><text x="24" y="314" class="s">외부 감사 계정 — 살까요, 기다릴까요</text>
    <rect x="24" y="324" width="60" height="24" rx="6" fill="#1b1a1f"/><text x="54" y="340" text-anchor="middle" font-size="11" fill="#f4efe4">살까요</text>
    <rect x="92" y="324" width="80" height="24" rx="6" fill="#1b1a1f"/><text x="132" y="340" text-anchor="middle" font-size="11" fill="#f4efe4">기다릴까요</text>
    <rect x="12" y="362" width="236" height="28" rx="10" class="card"/><circle cx="28" cy="376" r="4" class="live"/><text x="40" y="380" class="s">됐어요 — 도면 1판 · 아침 8:41</text>
    <!-- 오른쪽 단: 누가 뭘 했나 -->
    <text x="264" y="62" class="k">누가 뭘 했나 · 오늘</text>
    <rect x="260" y="70" width="234" height="262" rx="10" class="card"/>
    <g class="s">
      <circle cx="276" cy="92" r="4" fill="#4b5f9e"/><text x="288" y="96"><tspan class="t" font-weight="600">헨리</tspan> 색표·그림 둘</text><text x="486" y="96" text-anchor="end" class="m">1시간 전</text>
      <circle cx="276" cy="120" r="4" fill="#4a5d3a"/><text x="288" y="124"><tspan class="t" font-weight="600">테라</tspan> 마을 빛·재질</text><text x="486" y="124" text-anchor="end" class="m">1시간 전</text>
      <circle cx="276" cy="148" r="4" fill="#2f4f7a"/><text x="288" y="152"><tspan class="t" font-weight="600">하영</tspan> 브랜딩 2판 넘김</text><text x="486" y="152" text-anchor="end" class="m">2시간 전</text>
      <circle cx="276" cy="176" r="4" fill="#c96f3b"/><text x="288" y="180"><tspan class="t" font-weight="600">클레멘타인</tspan> 색표 스크립트</text><text x="486" y="180" text-anchor="end" class="m">2시간 전</text>
      <circle cx="276" cy="204" r="4" fill="#2f4f7a"/><text x="288" y="208"><tspan class="t" font-weight="600">유진</tspan> 사서 목차</text><text x="486" y="208" text-anchor="end" class="m">3시간 전</text>
      <circle cx="276" cy="232" r="4" fill="#1f5f4f"/><text x="288" y="236"><tspan class="t" font-weight="600">톰</tspan> 도면 결재 올림</text><text x="486" y="236" text-anchor="end" class="m">6시간 전</text>
      <text x="288" y="318">더 보기</text>
    </g>
    <!-- 아래: 팀 다섯 한 줄씩 -->
