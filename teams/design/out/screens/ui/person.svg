<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" font-family="'IBM Plex Sans KR','IBM Plex Sans','Apple SD Gothic Neo',sans-serif">
  <!-- 사람 카드 시안 2판 — 헨리 09-14 (M4). team-person.svg 1판에서 갈라 냄. 줄 셋(이름·직책·알약 / 지금 하는 일 / N분 전에 움직임) + 있을 때만 붙는 줄 둘: ▸ 대표님께 물어봄(결정 청한 것만, 1판) · ◂ 대표님이 불렀음 → 받았나(하영 2판 7절 ⑤, 새로). 상태 넷: 일하는 중 · 쉬는 중 · 자리 비움 · 멈춤(왜). 프로필 카드(profile.svg)의 "사람 카드 보기" 가 여기로 온다. 폰 폭 506 → 폰에선 388 로 줄고 줄은 같다. -->
  <defs><style>
    .k{font-size:10px;letter-spacing:.12em;fill:#8a8794}
    .t{font-size:12.5px;fill:#1b1a1f}.s{font-size:11px;fill:#6f6d78}.m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:#8a8794}
    .pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em}
    .card{fill:#ffffff;stroke:#e3ddd0}
    .row{fill:#fbf9f4;stroke:#e3ddd0}
  </style></defs>
  <rect width="560" height="640" fill="#f6f2ea"/>

  <g transform="translate(24 24)">
    <text x="0" y="-6" class="k">사람 카드 — 세 줄 + 있을 때만 줄 둘 (▸ 대표님께 물어봄 · ◂ 대표님이 부르셨어요)</text>

    <!-- 일하는 중 + 대표님이 불렀음 → 받았어요 -->
    <rect x="0" y="4" width="506" height="122" rx="12" class="card"/>
    <circle cx="30" cy="36" r="18" fill="#2f4f7a"/><text x="30" y="41" text-anchor="middle" font-size="12" fill="#f4efe4">하</text>
    <text x="58" y="32" class="t" font-size="13.5" font-weight="600">하영 <tspan class="s" font-weight="400">마케팅팀장</tspan></text>
    <rect x="410" y="20" width="82" height="22" rx="4" fill="none" stroke="#3a8f5c"/><text x="451" y="35" text-anchor="middle" class="pill" fill="#3a8f5c">일하는 중</text>
    <text x="58" y="56" class="t">7단계 마을 브랜딩 — 간판 문구 셋 안젤과 정하는 중</text>
    <text x="58" y="78" class="m">2분 전에 움직임</text>
    <rect x="58" y="88" width="434" height="26" rx="6" class="row"/>
    <circle cx="72" cy="101" r="3.5" fill="#3a8f5c"/>
    <text x="82" y="105" class="t">◂ 대표님이 부르셨어요 ·2분 전 → 받았어요, 답 쓰는 중</text>

    <!-- 멈춤 — 왜 + 대표님이 불렀음 → 못 와요 -->
    <rect x="0" y="140" width="506" height="122" rx="12" class="card"/>
    <circle cx="30" cy="172" r="18" fill="#6b4a2f"/><text x="30" y="177" text-anchor="middle" font-size="12" fill="#f4efe4">마</text>
    <text x="58" y="168" class="t" font-size="13.5" font-weight="600">마크 <tspan class="s" font-weight="400">외부 감사 · 다른 회사</tspan></text>
    <rect x="350" y="156" width="142" height="22" rx="4" fill="none" stroke="#c94a3a"/><text x="421" y="171" text-anchor="middle" class="pill" fill="#c94a3a">멈춤 · 계정 한도</text>
    <text x="58" y="192" class="t">디자인 4단계 검토 — 낼 것은 다 있는데 답을 못 냄</text>
    <text x="58" y="214" class="m">2시간 전에 움직임 · 20일 오후까지</text>
    <rect x="58" y="224" width="434" height="26" rx="6" class="row"/>
    <circle cx="72" cy="237" r="3.5" fill="#c94a3a"/>
    <text x="82" y="241" class="t">◂ 대표님이 부르셨어요 ·40분 전 → 못 와요 · 계정 한도, 20일 오후까지</text>

    <!-- 대표님께 물어봄 — ▸ 줄 (결정 청한 것만) -->
    <rect x="0" y="276" width="506" height="122" rx="12" class="card" stroke="#d8b25c" stroke-width="1.5"/>
    <rect x="0" y="276" width="3" height="122" rx="1" fill="#d8b25c"/>
    <circle cx="30" cy="308" r="18" fill="#2f6f8f"/><text x="30" y="313" text-anchor="middle" font-size="12" fill="#f4efe4">세</text>
    <text x="58" y="304" class="t" font-size="13.5" font-weight="600">세라 <tspan class="s" font-weight="400">비서</tspan></text>
    <rect x="380" y="292" width="112" height="22" rx="4" fill="#c94a3a"/><text x="436" y="307" text-anchor="middle" class="pill" fill="#ffffff">대표님께 물어봄</text>
    <text x="58" y="328" class="t">아침 보고서 — 대표님이 정하실 것 셋 추림</text>
    <text x="58" y="350" class="m">3분 전에 움직임</text>
    <rect x="58" y="360" width="434" height="26" rx="6" class="row"/>
    <text x="68" y="377" class="t">▸ "외부 감사 계정 — 크레딧을 살까요, 20일까지 기다릴까요" <tspan class="m">3분 전</tspan></text>

    <!-- 쉬는 중 · 자리 비움 — 짧게. 자리 비움이면 부르기 전에 안다 -->
    <rect x="0" y="414" width="246" height="72" rx="12" class="card"/>
    <circle cx="30" cy="444" r="16" fill="#a8541f"/><text x="30" y="449" text-anchor="middle" font-size="11" fill="#f4efe4">노</text>
    <text x="56" y="440" class="t" font-weight="600">노라 <tspan class="s" font-weight="400">감사</tspan></text>
    <rect x="166" y="426" width="70" height="20" rx="4" fill="none" stroke="#a8a6ae"/><text x="201" y="440" text-anchor="middle" class="pill" fill="#8a8794">쉬는 중</text>
    <text x="56" y="460" class="s">누가 부르면 답해요 · 40분 전에 움직임</text>
    <rect x="260" y="414" width="246" height="90" rx="12" class="card"/>
    <circle cx="290" cy="444" r="16" fill="#9c3b2f"/><text x="290" y="449" text-anchor="middle" font-size="11" fill="#f4efe4">레</text>
    <text x="316" y="440" class="t" font-weight="600">레오 <tspan class="s" font-weight="400">외부 감사</tspan></text>
    <rect x="426" y="426" width="70" height="20" rx="4" fill="none" stroke="#a8a6ae"/><text x="461" y="440" text-anchor="middle" class="pill" fill="#8a8794">자리 비움</text>
    <text x="316" y="460" class="s">계정 한도 — 20일 오후까지</text>
    <text x="316" y="480" class="s"><tspan fill="#c94a3a">◂</tspan> 대표님이 부르셨어요 · 12분 전 → 못 와요</text>

    <!-- 읽는 법 -->
    <g class="s">
      <text x="0" y="530">줄 셋 — 이름·직책·상태 / 지금 하는 일 / N분 전에 움직임. ▸ 줄은 대표님께 결정을 청했을 때만.</text>
      <text x="0" y="548">◂ 줄은 대표님이 그 사람을 불렀을 때만 — 받았나가 보인다: 받았어요, 답 쓰는 중 / 자리 비움 / 못 와요 · 계정 한도.</text>
      <text x="0" y="566">멈춤엔 늘 왜가 붙는다(대표님 답 · 결재 · 계정 한도 · 회차 없음). 발언 수·검토 결과 수·일지 줄 없음.</text>
      <text x="0" y="584">원 색 = 직책 색 = 마을 인형 옷 색 (얼굴은 6단계 뒤 그 자리에). 직책 글자는 결정 136 으로 확정(0-2 표 ① 열).</text>
      <text x="0" y="602">누르면: 카드 → 그 방의 그 말. ▸ 줄 → 대표님이 답하는 자리. ◂ 줄 → 그 부름이 있는 방. (이 다섯 줄은 시안 메모 — 화면 글자 아님)</text>
    </g>
  </g>
  <text x="548" y="632" text-anchor="end" font-size="9" fill="#a8a6ae">사람 카드 시안 2판 · 2026-09-14 · 헨리 · ui-spec.md 2절 · 낱말 하영 2판 3절·7절 ⑤</text>
</svg>
