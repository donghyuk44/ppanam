  <!-- 읽는 법 — 주석. 프레임 밖(하영 5판 3-5-4: 화면 글자가 아니라 시안 메모). 테라가 지을 때 이 글자는 안 짓는다 -->
  <g class="s" transform="translate(24 604)">
    <text x="0" y="0">읽는 법(시안 메모 — 화면 글자 아님) — 왼쪽 폰 412 · 오른쪽 데스크톱 1200 폭(2주까지 한눈에). 줄 = 팀(도면 순서), 가로 = 앞으로의 시간. 칸 하나 = 단계 하나.</text>
    <text x="0" y="18">상태 넷 — 채움 = 지금 단계 · 채움 옅게 = 잡힌 예정(timebox 를 셀 수 있음) · 점선 = 셀 수 없는 것("대표님이 정한 뒤" / "{무엇} 뒤") · 빨강 = 늦음/멈춤("N단계 N분 늦음", 멈춘 시간은 뺀 것).</text>
    <text x="0" y="36">누르면 그 자리에서 왜(펼친 줄 — 시작 때 · 회차 평균 × N회차 → 끝 / 계획표에 적힌 조건) → 한 번 더 = 계획표 카드. 지난 것은 없다 — 현황과 안 겹치게(나리 규칙).</text>
    <text x="0" y="54">예정 시각은 계획표 timebox × 회차 길이에서 개발이 계산, 손으로 안 적는다. 빈칸 말 둘 — 계획표 파일이 없으면 "계획표 아직 없어요", 남은 단계가 없으면 "다음 단계 아직 없어요". 대표 문이 아니다.</text>
    <text x="0" y="72">칸 오른쪽 점 둘 = 그 팀의 둘(머리글자 · 직책 색, 결정 128 "누가") — cast.json 에서 다른 회사 뺀 둘, 팀장 먼저. 시계 없음(9절 3). 글자는 하영 글 틀 1판(screen-text-frames.md 1절) · 사전 6판 6절.</text>
