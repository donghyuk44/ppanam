<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="'IBM Plex Sans KR','IBM Plex Sans','Apple SD Gothic Neo',sans-serif">
  <!-- 대시보드 2판 — 클레멘타인 09-14(1판 헨리). 나리 '화면이 답하는 질문': 대시보드 = "앞으로 언제 뭐가 되나". 다섯 팀 예정이 한 화면(통과 조건). 지난 것은 안 보인다 — 지금 선의 오른쪽만. 그림은 numbers.md 의 앞날 띠. 왼쪽 폰 412 · 오른쪽 데스크톱.
       opsroom-content-2.md 9절 4 두 가지: ① 칸마다 담당 둘 — 결정 128 "언제 어디서 누가". 칸(예정 상자) 오른쪽 위·아래 모서리에 작은 점 둘(자리 색, cast.json) = 그 칸을 실제로 만드는 두 사람. 팀 이름 옆 색 점과는 다르다(그건 팀, 이건 사람) ② "대표가 정해야 열리는 것" 카드 목록을 뺐다 — 점선 칸이 이미 "대표가 정한 뒤"라 적어 같은 것을 두 번 보여줬다(안젤 R33 지적, req_162309ee).
       세다가 걸린 것 — 마케팅 안젤과 경영 노라가 cast.json 에서 같은 색(#a8541f)이다. 두 사람이 다른 줄(마케팅·경영)에 떨어져 있어 바로 옆에서는 안 겹친다 — 나리 대리 결정(09-15 밤)으로 그대로 두고 나란히 설 때만 다시 본다. 유진 색은 잎 초록 #6f9a4a 로 확정(놋쇠 임시 방편은 끝) — 경영 담당 점도 이 색 그대로.
       3판(09-16 헨리, 하영 글 틀 1판 teams/marketing/out/screen-text-frames.md 5절 H1~H3 + 1-2·1-4): 상태 넷 = running 채움 · planned 채움 옅게(timebox 를 셀 수 있는 잡힌 예정) · gated 점선(셀 수 없는 것 — "대표님이 정한 뒤" / "{무엇} 뒤") · blocked 빨강. 빈칸 말 둘(계획표 아직 없어요 · 다음 단계 아직 없어요)은 대표 문이 아니다. 늦음 글자는 단계 번호로("6단계 40분 늦음" — 무엇이 늦었는지는 서버가 모른다). 점 둘 = 그 팀의 둘(다른 회사 뺀 둘, 팀장 먼저 — cast.json). -->
