  <!-- 읽는 법 — 시안 메모. 프레임 밖(하영 5판 3-5-4). 테라가 지을 때 이 글자는 안 짓는다 -->
  <g class="s" transform="translate(24 584)">
    <text x="0" y="0">읽는 법(시안 메모 — 화면 글자 아님) — 칸 셋, 넷을 안 넘는다(ui-spec 0절 2). 칸마다 첫 층에 그림 하나 + 문장 하나. 숫자는 늘 둘이 나란히(a건 중 b · 지난 → 이번 · N번째) — 하나짜리 타일은 없다.</text>
    <text x="0" y="18">① 팀마다 같은 자(1건 = 같은 길이) — 옅은 띠 = 올린 결재, 짙은 띠 = 돌려보낸 것. 튀는 팀 하나만 빨강, 나머지는 제 색(numbers ⑥).</text>
    <text x="0" y="36">② 지난 = 회색, 이번 = 나빠짐 빨강 / 좋아짐 초록 / 같음 회색(위·아래 색). 멈춘 시간은 뺐다고 밑에 한 줄. ③ 회차 네모를 같은 자리에 겹친다 — 세 번째부터 빨강(반박 세 번 = FAIL 과 같은 자).</text>
    <text x="0" y="54">누르면 그 자리에서 펼친 줄(어느 카드·어느 회차) → 한 번 더 = 결재 카드 / 회차의 그 말. 두 번이면 닿는다. "대표님이 누르기까지" 줄은 대표님 답 뒤(하영 8절).</text>
    <text x="0" y="72">빈칸 말 — 견줄 것이 하나뿐이면 "견줄 회차가 아직 없어요 — 회차 둘이 끝나면 떠요", 같은 자리를 두 번 돈 일이 없으면 "같은 자리를 두 번 간 일이 없어요"(사전 6판 6절).</text>
    <text x="0" y="90">값은 하영 글 틀 1판 4절 실물 그대로(approvals.jsonl · rounds.jsonl · pauses.json) — 손으로 안 적고 개발이 센다. 색은 임시 hex, 토큰으로.</text>
    <text x="0" y="112" class="k">서버 값 — analysis.stuck[{ team, what, total, count }] · slowed[{ team, what, prev, cur, pausedMs }] · repeats[{ team, what, at[], nth, passed }] — 셈은 하영 3-3</text>
  </g>
  <text x="988" y="732" text-anchor="end" font-size="9" fill="#a8a6ae">분석 1판 · 2026-09-16 · 헨리 · 하영 글 틀 1판 3·4절(H4) · 나리 화면이-답하는-질문 41~44행 · numbers.md ⑤·⑥ · 결정 92</text>
</svg>
