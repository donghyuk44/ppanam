  <text x="24" y="480" class="memo">시안 메모(화면 글자 아님) — 폰 블록 128: 머리 1 · 줄기 막대 2(이름 + 막대) · 기다림 2 = 다섯 줄. 막대 폭은 줄기마다 같고(48) 칸은 일 수로 나눈다 — 수는 머리에 넷, 줄기엔 안 쓴다(폰). PC 는 칸 하나 = 일 하나(22×10)라 세면 수가 나온다.</text>
  <text x="24" y="497" class="memo">막힘 0 이면 '막힘 0' 을 안 쓴다(0 은 안 보인다, ui-spec 0절 2). 막힘이 생기면 그 칸이 빨강이고 머리에 '막힘 N' 이 빨강으로 선다. 빈 줄기(M0 안 함)는 안 그린다. 기다림은 work.json after 를 사람 이름으로 — 같은 사람이 여럿을 기다리면 한 줄에 모은다.</text>
  <text x="24" y="514" class="memo">상태 색: 통과 초록 #3a8f5c · 감사 대기 놋쇠 #d8b25c · 막힘 빨강 #c94a3a · 대기 회색 #e3ddd0(numbers.md 넷) + 진행 먹 #4a443b. 팀 색은 안 쓴다 — 줄기는 팀이 아니다.</text>
  <text x="24" y="531" class="memo">서버 값(W1 솔라, /api/work) — { streams:[{ name, pass, run, audit, wait, stuck, startable }], waits:[{ who, on, what }], total }. 누르면 타임라인 탭(보드 전체).</text>
  <text x="24" y="548" class="memo">작업 보드 블록 시안 1판 · 2026-09-16 아침 · 헨리 · 나리 카드-체계-0916.md 1-1절 · 값 state/work.json 08:2x · 글자 하영 card-words.md 2판</text>
