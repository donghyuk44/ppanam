<svg xmlns="http://www.w3.org/2000/svg" width="440" height="740" viewBox="0 0 440 740" font-family="'IBM Plex Sans KR','IBM Plex Sans','Apple SD Gothic Neo',sans-serif">
  <!-- 팀 카드 시안 2판 — 헨리 09-14 (M4). team-person.svg 1판에서 갈라 냄(하영 2판 3절 판정 전부 "쓴다" — 줄은 그대로, 단계 칸만 지금 계획표(6단계)로). ui-spec.md 2절. 현황 ④ 팀 줄을 누르면 펼친 줄(상황판 네 칸), 한 번 더 누르면 이것 (두 번 = 카드). 방 오른쪽 첫 카드도 이것. 폰 폭 388. -->
  <defs><style>
    .k{font-size:10px;letter-spacing:.12em;fill:#8a8794}
    .h{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:16px;fill:#1b1a1f}
    .t{font-size:12.5px;fill:#1b1a1f}.s{font-size:11px;fill:#6f6d78}.m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:#8a8794}
    .pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em}
    .card{fill:#ffffff;stroke:#e3ddd0}
  </style></defs>
  <rect width="440" height="740" fill="#f6f2ea"/>

  <g transform="translate(24 24)">
    <text x="0" y="-6" class="k">팀 카드 — 현황 ④ 팀 줄 → 펼친 줄 → 이것 (두 번 = 카드)</text>
    <rect x="0" y="4" width="388" height="672" rx="12" class="card"/>
    <!-- 머리: 팀 · 장·단계·회차 · 상태 -->
    <text x="16" y="34" class="h">디자인팀</text>
    <rect x="300" y="18" width="74" height="20" rx="4" fill="none" stroke="#c94a3a"/><text x="337" y="32" text-anchor="middle" class="pill" fill="#c94a3a">멈춤</text>
    <text x="16" y="54" class="s">1장 4단계 화면 시안 · 16회차 · 검토 기다림</text>
    <!-- 단계 칸 — 도면 2겹 그대로 (끝난 것 채움 · 지금 굵은 테두리 · 남은 것 점선), 회차 네모는 지금 단계 오른쪽 -->
    <text x="16" y="84" class="k">단계 3/6</text>
    <rect x="16" y="92" width="356" height="28" rx="6" fill="#e6e0d3" stroke="#d9d1bf"/><text x="26" y="110" class="t">1단계 그림 방향과 부품 밑그림</text>
    <rect x="16" y="126" width="356" height="28" rx="6" fill="#e6e0d3" stroke="#d9d1bf"/><text x="26" y="144" class="t">2단계 인형 — 사람마다 하나</text>
    <rect x="16" y="160" width="356" height="28" rx="6" fill="#e6e0d3" stroke="#d9d1bf"/><text x="26" y="178" class="t">3단계 건물 부품 실물</text>
    <rect x="16" y="194" width="356" height="28" rx="6" fill="#ffffff" stroke="#1b1a1f" stroke-width="1.5"/><rect x="16" y="194" width="3" height="28" fill="#3a8f5c"/><text x="26" y="212" class="t" font-weight="600">4단계 화면 시안 · 지금</text>
    <g><rect x="318" y="202" width="11" height="11" rx="2" fill="#8a8794"/><rect x="333" y="202" width="11" height="11" rx="2" fill="none" stroke="#3a8f5c" stroke-width="1.5"/><rect x="348" y="202" width="11" height="11" rx="2" fill="none" stroke="#a8a6ae"/></g>
    <rect x="16" y="228" width="356" height="28" rx="6" fill="none" stroke="#a8a6ae" stroke-dasharray="4 3"/><text x="26" y="246" class="s">5단계 첫 화면 맞춤 — 대표님 방향 뒤</text>
    <rect x="16" y="262" width="356" height="28" rx="6" fill="none" stroke="#a8a6ae" stroke-dasharray="4 3"/><text x="26" y="280" class="s">6단계 얼굴 썸네일 열일곱</text>
    <!-- 이 회차 — 상황판 네 칸(글자는 progress.mjs 그대로: 하는 것 · 막힌 것 · 대표 차례 · 다음 — 현황 ④ 펼친 줄과 같은 넷). 2판-b: "하는 일"→"하는 것", 빠졌던 "대표 차례" 줄 넣음(클레멘타인 셈) -->
    <text x="16" y="316" class="k">이 회차</text>
    <text x="16" y="336" class="t"><tspan class="s">하는 것 </tspan>헨리 관제탑 3판 · 클레멘타인 보고서·대시보드</text>
    <text x="16" y="356" class="t"><tspan class="s">막힌 것 </tspan><tspan fill="#c94a3a">외부 감사 계정 한도 — 4단계 검토가 못 끝남</tspan></text>
    <text x="16" y="376" class="t"><tspan class="s">대표님이 보실 것 </tspan>없어요</text>
    <text x="16" y="396" class="t"><tspan class="s">다음 </tspan>검토 결과 → 대표님께 그림</text>
    <g transform="translate(0 20)">
    <!-- 다른 팀에 부탁한 일 -->
    <text x="16" y="410" class="k">다른 팀에 부탁한 일 1</text>
    <rect x="16" y="418" width="356" height="44" rx="6" fill="#fbf9f4" stroke="#e3ddd0"/>
    <text x="26" y="436" class="t">마케팅 → 디자인 · 관제탑 내용 2판대로 다음 판</text><text x="26" y="452" class="s">진행 중 · 하영 확정본 옴 · 헨리 3판 그리는 중</text>
    <!-- 사람 셋 -->
    <text x="16" y="494" class="k">사람</text>
    <g>
      <circle cx="34" cy="524" r="16" fill="#4b5f9e"/><text x="34" y="529" text-anchor="middle" font-size="11" fill="#f4efe4">헨</text>
      <text x="60" y="521" class="t" font-weight="600">헨리 <tspan class="s" font-weight="400">디자인팀장</tspan></text><text x="60" y="537" class="s">관제탑 3판 그리는 중 · 3분 전에 움직임</text>
      <rect x="300" y="514" width="72" height="20" rx="4" fill="none" stroke="#3a8f5c"/><text x="336" y="528" text-anchor="middle" class="pill" fill="#3a8f5c">일하는 중</text>
      <circle cx="34" cy="570" r="16" fill="#c96f3b"/><text x="34" y="575" text-anchor="middle" font-size="11" fill="#f4efe4">클</text>
      <text x="60" y="567" class="t" font-weight="600">클레멘타인 <tspan class="s" font-weight="400">디자이너</tspan></text><text x="60" y="583" class="s">보고서 세는 중 · 8분 전에 움직임</text>
      <rect x="300" y="560" width="72" height="20" rx="4" fill="none" stroke="#3a8f5c"/><text x="336" y="574" text-anchor="middle" class="pill" fill="#3a8f5c">일하는 중</text>
      <circle cx="34" cy="616" r="16" fill="#6b4a2f"/><text x="34" y="621" text-anchor="middle" font-size="11" fill="#f4efe4">마</text>
      <text x="60" y="613" class="t" font-weight="600">마크 <tspan class="s" font-weight="400">외부 감사 · 다른 회사</tspan></text><text x="60" y="629" class="s">4단계 재는 중 · 계정 한도</text>
      <rect x="300" y="606" width="72" height="20" rx="4" fill="none" stroke="#c94a3a"/><text x="336" y="620" text-anchor="middle" class="pill" fill="#c94a3a">멈춤</text>
    </g>
    </g>
  </g>
  <!-- 주석 — 카드 밖(하영 5판 3-5-4) -->
  <text x="24" y="716" class="s">시안 메모(화면 글자 아님) — 카드 안에서 누르면 옆으로만(넷째 겹 없음): 단계 → 계획표 카드 · 부탁한 일 → 그 대화 · 사람 → 사람 카드</text>
  <text x="428" y="732" text-anchor="end" font-size="9" fill="#a8a6ae">팀 카드 시안 2판-b · 2026-09-15 · 헨리 · ui-spec.md 2절 · 낱말 하영 2판 3절 · 상황판 네 칸(클레멘타인 셈)</text>
</svg>
