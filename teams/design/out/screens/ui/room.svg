  </g>

  <text x="24" y="960" class="memo">시안 메모(화면 글자 아님) — 방 머리의 회차 줄·'회차 마무리' 단추는 고정 카드 꼬리(N단계 끝/전체 · 회차)로 들어간다. 판정 카드는 도장(PASS·REVISE)을 대신하고 말풍선과 같은 폭. 이름표 32 원(1판-c, 전엔 r9) 에 out/faces 얼굴(clip) — 얼굴 없으면 머리글자.</text>
  <text x="24" y="977" class="memo">탭 다섯은 하영 card-words.md 2판 확정(채팅·대시보드·타임라인·리포트·설정). 알약·판정·B 줄 글자도 2판(진행 중 · 승인 · 나리·제리 검토 중). 결재 띠는 C 가 있을 때만 위에 선다(여기 0). PC 오른쪽 여백은 비워 둔다. 말은 09-16 07:3x 디자인 방 기록을 줄인 것, 시각은 우리 시각.</text>
  <text x="24" y="994" class="memo">팀 방 시안 1판-b(하영 2판 글자) · 2026-09-16 아침 · 헨리 · cards.svg 세 자리 중 ③(팀 방 맨 위) + 말풍선 사이 판정 카드 · C7(테라) 그림 자료 · 얼굴 파일 req_99dbd1fe</text>
