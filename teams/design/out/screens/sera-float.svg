<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="'IBM Plex Sans KR','IBM Plex Sans','Apple SD Gothic Neo',sans-serif">
  <!-- 떠 있는 세라 — 시안(SVG, 헨리 09-14 새벽). 생성 그림 통로가 닫혀 도형으로 먼저. 왼쪽: 가만히 · 오른쪽: 말풍선. 각 칸 300×300, 세라 키 200. 배경은 투명(체크무늬는 여기서만). -->
  <defs>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9e5dc"/><rect x="8" y="8" width="8" height="8" fill="#e9e5dc"/><rect x="8" width="8" height="8" fill="#f6f3ec"/><rect y="8" width="8" height="8" fill="#f6f3ec"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="sera">
      <!-- 발밑 그림자 (막대 위에만) -->
      <ellipse cx="0" cy="196" rx="44" ry="8" fill="#1b1a1f" opacity="0.12" filter="url(#soft)"/>
      <!-- 땋은 머리 (뒤) -->
      <path d="M22 60 q 26 30 14 96 q -4 14 -14 14 q -10 0 -12 -14 q 6 -60 -4 -84z" fill="#1b1a1f"/>
      <rect x="4" y="150" width="30" height="24" rx="10" fill="#1b1a1f"/>
      <!-- 리본 -->
      <path d="M20 170 l -18 -9 v 18 z" fill="#c94a3a"/><path d="M20 170 l 18 -9 v 18 z" fill="#c94a3a"/><circle cx="20" cy="170" r="4" fill="#9c3b2f"/>
      <!-- 다리 · 신 -->
      <rect x="-22" y="150" width="18" height="34" rx="8" fill="#f4efe4"/><rect x="4" y="150" width="18" height="34" rx="8" fill="#f4efe4"/>
      <rect x="-24" y="178" width="22" height="12" rx="6" fill="#3d3a44"/><rect x="2" y="178" width="22" height="12" rx="6" fill="#3d3a44"/>
      <!-- 몸통 (물색 상의) -->
      <rect x="-34" y="92" width="68" height="66" rx="20" fill="#5f8fbf"/>
      <!-- 팔 -->
      <rect x="-50" y="100" width="18" height="44" rx="9" fill="#5f8fbf"/><rect x="32" y="100" width="18" height="44" rx="9" fill="#5f8fbf"/>
      <circle cx="-41" cy="146" r="9" fill="#f3d3b3"/><circle cx="41" cy="146" r="9" fill="#f3d3b3"/>
      <!-- 머리 -->
      <circle cx="0" cy="52" r="46" fill="#f3d3b3"/>
      <path d="M-46 52 a46 46 0 0 1 92 0 q -6 -22 -46 -24 q -40 2 -46 24z" fill="#1b1a1f"/>
      <path d="M-46 50 q 10 -10 22 -4 q 8 -12 24 -12 q 20 0 30 12 q 10 -4 16 4 v -8 a46 46 0 0 0 -92 0z" fill="#1b1a1f"/>
      <!-- 눈 · 입 -->
      <ellipse cx="-16" cy="58" rx="4" ry="6" fill="#1b1a1f"/><ellipse cx="16" cy="58" rx="4" ry="6" fill="#1b1a1f"/>
      <path d="M-7 74 q 7 6 14 0" fill="none" stroke="#1b1a1f" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-28" cy="70" r="6" fill="#c94a3a" opacity="0.25"/><circle cx="28" cy="70" r="6" fill="#c94a3a" opacity="0.25"/>
    </g>
    <g id="pill">
      <rect x="-110" y="0" width="220" height="48" rx="24" fill="#f4efe4" stroke="#d9d1bf"/>
      <!-- 고치기 (렌치) -->
      <g transform="translate(-60 24)" stroke="#3d3a44" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-7 7 l 9 -9"/><circle cx="5" cy="-5" r="4.5"/><path d="M-9 9 l -2 2"/></g>
      <!-- 소리 (스피커) -->
      <g transform="translate(0 24)" fill="#3d3a44"><path d="M-9 -4 h 5 l 7 -6 v 20 l -7 -6 h -5z"/><path d="M6 -4 q 5 4 0 8" fill="none" stroke="#3d3a44" stroke-width="2" stroke-linecap="round"/></g>
      <!-- 알림 (종 + 배지) -->
      <g transform="translate(60 24)"><path d="M-8 6 v -6 a8 8 0 0 1 16 0 v 6 l 3 3 h -22z" fill="#3d3a44"/><rect x="-3" y="9" width="6" height="3" rx="1.5" fill="#3d3a44"/><circle cx="9" cy="-8" r="7" fill="#c94a3a"/><text x="9" y="-4.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text></g>
    </g>
  </defs>

  <!-- 왼쪽 칸 — 가만히 -->
  <rect x="10" y="10" width="300" height="300" fill="url(#chk)" rx="8"/>
  <use href="#sera" transform="translate(160 44)"/>
  <use href="#pill" transform="translate(160 250)"/>
  <text x="160" y="312" text-anchor="middle" font-size="9" fill="#8a8794">가만히 — 세라 200px · 막대 220×48 · 아이콘 셋 60px 간격</text>

  <!-- 오른쪽 칸 — 말풍선 -->
  <rect x="330" y="10" width="300" height="300" fill="url(#chk)" rx="8"/>
  <use href="#sera" transform="translate(440 60)"/>
  <use href="#pill" transform="translate(440 250)"/>
  <g transform="translate(500 26)">
    <path d="M0 0 h 124 a 10 10 0 0 1 10 10 v 46 a 10 10 0 0 1 -10 10 h -84 l -12 12 v -12 h -28 a 10 10 0 0 1 -10 -10 v -46 a 10 10 0 0 1 10 -10z" fill="#ffffff" stroke="#d9d1bf"/>
    <text x="12" y="26" font-size="12" fill="#1b1a1f">좋은 아침이에요.</text>
    <text x="12" y="46" font-size="12" fill="#1b1a1f">밤새 세 가지가 올라왔어요.</text>
  </g>
  <text x="480" y="312" text-anchor="middle" font-size="9" fill="#8a8794">말풍선 — 머리 오른쪽 위, 최대 두 줄, 꼬리는 입 쪽</text>
</svg>
