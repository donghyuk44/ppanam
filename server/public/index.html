<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>작전실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <link rel="stylesheet" href="/world/world.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💬</text></svg>">
</head>
<body>
<div class="app" id="app" data-view="room">

  <!-- 맨 위: 대표 차례. 승인 대기가 있으면 어느 탭에서든 여기 뜬다 — 관제탑에만 있어서 대표가 못 찾았다 (결정 20). -->
  <section class="approvals" id="approvals" hidden></section>

  <!-- 종 — 모든 탭 오른쪽 위, 빨간 배지에 대표 차례 수 (네이버 폰 화면 기준, 결정 34). 누르면 항목 목록. -->
  <div class="bell" id="bell">
    <button type="button" class="bell__btn" id="bossBadge" aria-label="대표 차례" title="대표 차례 — 누르면 목록">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>
      </svg>
      <span class="bell__n" id="bellN" hidden></span>
    </button>
    <div class="bell__menu" id="bellMenu" hidden></div>
  </div>

  <!-- 왼쪽: 팀 레일. 탭이 아니라 계기판이다. -->
  <aside class="rail">
    <div class="rail__head">
      <span class="rail__mark">ppanam</span>
      <span class="rail__sub">작전실</span>
    </div>
    <nav class="views" id="views" aria-label="화면">
      <button type="button" data-view="room">작전실</button>
      <button type="button" data-view="tower">관제탑</button>
      <button type="button" data-view="analysis">분석</button>
      <button type="button" data-view="world">마을</button>
    </nav>
    <nav class="rail__list" id="teams" aria-label="팀"></nav>
  </aside>

  <!-- 가운데: 대화 -->
  <section class="room">
    <header class="bar">
      <div class="bar__id">
        <h1 id="roomName">작전실</h1>
        <!-- 자리마다 상태 글자 — 폰에서는 칩(crew)이 숨어 이 줄이 전부다 (독립검수 #5) -->
        <div class="who" id="roomWho">연결 중…</div>
      </div>
      <div class="bar__right">
        <div class="crew" id="crew"></div>
        <!-- 서버 연결 점. 칩 밖에 둔다 — 폰에서도 보여야 한다 -->
        <div class="live" id="liveDot" data-on="0" title="서버 연결"></div>
        <button class="iconbtn" id="sideToggle" aria-label="상황판 열기">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="roundbar" id="roundbar">
      <span class="rnum" id="rnum">—</span>
      <span class="rtitle" id="rtitle">대기 중</span>
      <span class="rwork" id="rwork" hidden>실무가 일하는 중</span>
      <span class="rprog" id="rprog"></span>
      <button class="rbtn" id="roundBtn" type="button">라운드 열기</button>
    </div>

    <form class="roundopen" id="roundOpen" hidden>
      <input class="roundopen__in" id="roundTopic" type="text" autocomplete="off"
             placeholder="이번 라운드에서 무엇을 하나요">
      <input class="roundopen__ms" id="roundMs" type="number" min="1" step="1"
             inputmode="numeric" placeholder="M" title="마일스톤 번호">
      <button class="roundopen__go" type="submit">시작</button>
      <button class="roundopen__x" type="button" id="roundCancel">취소</button>
    </form>

    <main class="feed" id="feed" aria-live="polite">
      <div class="loadmore" id="loadMore" hidden>
        <button type="button" id="loadMoreBtn">이전 대화 더 보기</button>
      </div>
      <div class="stream" id="stream"></div>
    </main>

    <div class="composer__msg" id="composerMsg" hidden></div>

    <form class="composer" id="composer">
      <textarea class="composer__in" id="input" rows="1" autocomplete="off" placeholder="실무에게 지시하기" enterkeyhint="send"></textarea>
      <button class="composer__nl" id="composerNl" type="button" aria-label="줄바꿈" title="줄바꿈 (컴퓨터에서는 Shift+Enter)">↵</button>
      <button class="composer__go" type="submit" aria-label="보내기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </section>

  <!-- 관제탑: 네 팀을 한 화면에 -->
  <section class="tower" id="tower">
    <header class="tower__head">
      <h1>관제탑</h1>
      <p>모든 작전실을 한 화면에서 봅니다. 카드에서 바로 지시할 수 있습니다.</p>
    </header>
    <div class="tower__grid" id="towerGrid"></div>
  </section>

  <!-- 분석: 팀 하나를 깊게 -->
  <section class="analysis" id="analysis">
    <header class="tower__head">
      <h1 id="anTitle">분석</h1>
      <p>왼쪽에서 팀을 고르면 그 작전실의 이력을 봅니다.</p>
    </header>
    <div class="an__body" id="anBody"></div>
  </section>

  <!-- 마을: 도트 마을에서 캐릭터와 말풍선으로 본다 -->
  <section class="world" id="world">
    <header class="world__bar">
      <div><h1>마을</h1><span class="world__hint">방향키로 댄을 움직이고, 누군가의 옆에서 Enter 를 누르면 말을 겁니다. 캐릭터를 누르면 그 사람이 누구인지, 말풍선의 ↗ 를 누르면 작전실의 그 발언이 보입니다.</span></div>
      <div class="world__ctl">
        <span class="world__scene" id="wvScene"><button type="button" data-scene="village">마을</button><button type="button" data-scene="castle">회사</button></span>
        <select id="wvGo" aria-label="어디로"></select>
        <button type="button" id="wvGoBtn">이동</button>
        <span class="world__sep"></span>
        <select id="wvTeam" aria-label="재생할 팀"></select>
        <select id="wvRound" aria-label="재생할 라운드"></select>
        <button type="button" id="wvPlay">재생</button>
        <button type="button" id="wvStop" hidden>멈춤</button>
        <select id="wvSpeed" aria-label="재생 속도"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
        <select id="wvZoom" aria-label="배율"><option value="1">작게</option><option value="2" selected>보통</option><option value="3">크게</option></select>
        <label><input type="checkbox" id="wvCam" checked> 말하는 쪽으로 따라가기</label>
        <span class="world__clock" id="wvClock" title="세상의 시계 — state/world.json"></span>
        <select id="wvHour" aria-label="시험용 시각" title="시험용으로 시각을 고정한다. 실제 시각으로 돌리려면 첫 항목"><option value="">실제 시각</option><option value="9">09시 출근</option><option value="12">12시 점심</option><option value="15">15시 근무</option><option value="19">19시 퇴근</option><option value="23">23시 밤</option></select>
        <span class="world__status" id="wvStatus"></span>
      </div>
    </header>
    <div class="world__view" id="wvView">
      <div class="world__inner" id="wvInner">
        <canvas id="wvCanvas"></canvas>
        <div class="world__labels" id="wvLabels"></div>
        <div class="world__bubbles" id="wvBubbles"></div>
      </div>
      <form class="world__talk" id="wvTalk" hidden>
        <input id="wvTalkIn" type="text" autocomplete="off">
        <button type="submit">말하기</button>
        <button type="button" id="wvTalkX">닫기</button>
      </form>
      <div class="world__toast" id="wvToast" hidden></div>
    </div>
    <aside class="world__card" id="wvCard" hidden aria-live="polite"></aside>
  </section>

  <!-- 오른쪽: 상황판 -->
  <aside class="side" id="side">
    <div class="side__head">
      <span>상황판</span>
      <button class="iconbtn" id="sideClose" aria-label="닫기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="side__body">
      <section class="card" id="cardRound"></section>
      <section class="card" id="cardRoadmap"></section>
      <section class="card" id="cardCrew"></section>
      <section class="card" id="cardJournal"></section>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
