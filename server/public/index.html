<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ppanam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <link rel="stylesheet" href="/world/world.css">
  <!-- 마을 3D (M5) — three 는 jsDelivr(결정 39)에서, 판은 고정. world/draw3d.js 만 쓰고 world.js 가 늦게 불러서 CDN 이 죽어도 작전실은 산다. -->
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <!-- 길찾기 EasyStar.js — 전역 EasyStar. 못 오면 world.js 가 제 bfs 로 간다 (snapshot().pathfinder 로 어느 쪽인지 본다). -->
  <script src="https://cdn.jsdelivr.net/npm/easystarjs@0.4.4/bin/easystar-0.4.4.min.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💬</text></svg>">
</head>
<body>
<div class="app" id="app" data-view="room">

  <!-- 맨 위: 대표 차례. 승인 대기가 있으면 어느 탭에서든 여기 뜬다 — 관제탑에만 있어서 대표가 못 찾았다 (결정 20). -->
  <section class="approvals" id="approvals" hidden></section>

  <!-- 종 — 모든 탭 오른쪽 위, 빨간 배지에 대표 차례 수 (네이버 폰 화면 기준, 결정 34). 누르면 항목 목록. -->
  <div class="bell" id="bell">
    <button type="button" class="bell__btn" id="bossBadge" aria-label="대표님이 보실 것" title="대표님이 보실 것 — 누르면 목록">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>
      </svg>
      <span class="bell__n" id="bellN" hidden></span>
    </button>
    <div class="bell__menu" id="bellMenu" hidden></div>
  </div>

  <!-- 왼쪽: 팀 레일. 탭이 아니라 계기판이다. -->
  <aside class="rail">
    <div class="rail__head">
      <span class="rail__mark">ppanam</span>
      <!-- 부제(옛 '작전실')는 세계 이름이 안 정해져 비운다(하영 L1 1절 — 제품 이름 하나만, 대표 한마디 자리). 같은 글자 둘이 겹치지 않게 -->
      <span class="rail__sub" hidden></span>
    </div>
    <nav class="views" id="views" aria-label="화면">
      <!-- 탭 다섯은 표준어(대표 09-16 07:4x "어디 회사나 서비스나 플랫폼에서 이런 단어를 사용하냐" → 카드-체계-0916 4절 · 사전 0-3, 나리 R32). 속 이름(data-view·주소)은 그대로 —
           room=채팅 · tower=대시보드 · dashboard=타임라인 · report=리포트(둘째 탭이 analysis) · settings=설정. 옛 이름(팀 방·현황·앞으로·보고서·분석)은 사전 0-1 에 남는다. -->
      <button type="button" data-view="room">채팅</button>
      <button type="button" data-view="tower">대시보드</button>
      <button type="button" data-view="dashboard">타임라인</button>
      <button type="button" data-view="report">리포트</button>
      <button type="button" data-view="settings">설정</button>
      <!-- 분석은 리포트 안 둘째 탭(리포트 머리의 repTabs) — 단추는 숨기고 주소·aria-current 는 리포트 단추가 받는다(app.js setView). -->
      <button type="button" data-view="analysis" hidden>분석</button>
      <!-- 마을 탭은 대표 화면에서 숨긴다(대표 09-16 07:2x '마을은 최최최최후', 나리 R32) — 오류가 많아 대표가 보면 안 된다. 설정 맨 아래 '숨김 화면' 링크나 주소(#팀/world)로 열면 그때 보인다(app.js setView). -->
      <button type="button" data-view="world" hidden>마을</button>
    </nav>
    <nav class="rail__list" id="teams" aria-label="팀"></nav>
    <!-- 폰에서 띠 밖에 안 읽은 방이 있을 때 (검수 #4). 누르면 띠를 끝까지 민다. -->
    <button type="button" class="rail__more" id="railMore" hidden>이전 화면</button>
  </aside>

  <!-- 가운데: 대화 -->
  <section class="room">
    <header class="bar">
      <div class="bar__id">
        <h1 id="roomName">채팅</h1>
        <!-- 자리마다 상태 글자 — 폰에서는 칩(crew)이 숨어 이 줄이 전부다 (독립검수 #5) -->
        <div class="who" id="roomWho">연결 중…</div>
      </div>
      <div class="bar__right">
        <div class="crew" id="crew"></div>
        <!-- 서버 연결 점. 칩 밖에 둔다 — 폰에서도 보여야 한다 -->
        <div class="live" id="liveDot" data-on="0" title="서버 연결"></div>
        <button class="iconbtn" id="sideToggle" aria-label="상황판 열기">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="roundbar" id="roundbar">
      <span class="rnum" id="rnum">—</span>
      <span class="rtitle" id="rtitle">진행 중인 회차 없음</span>
      <span class="rwork" id="rwork" hidden>진행 중</span>
      <span class="rprog" id="rprog"></span>
      <button class="rbtn" id="roundBtn" type="button">회차 시작</button>
    </div>

    <form class="roundopen" id="roundOpen" hidden>
      <input class="roundopen__in" id="roundTopic" type="text" autocomplete="off"
             placeholder="이번 회차">
      <!-- 마일스톤은 번호 칸이 아니라 로드맵 제목 목록에서 고른다 (검수 #6 — 'M' 이 뭔지 알 수 없었다). 주제를 비우면 고른 마일스톤 제목이 주제가 된다. -->
      <select class="roundopen__ms" id="roundMs" title="이번 회차의 단계 — 계획표에서 고른다"></select>
      <button class="roundopen__go" type="submit">시작</button>
      <button class="roundopen__x" type="button" id="roundCancel">취소</button>
    </form>

    <main class="feed" id="feed" aria-live="polite">
      <div class="loadmore" id="loadMore" hidden>
        <button type="button" id="loadMoreBtn">이전 대화 더 보기</button>
      </div>
      <div class="stream" id="stream"></div>
    </main>

    <div class="composer__msg" id="composerMsg" hidden></div>

    <form class="composer" id="composer">
      <textarea class="composer__in" id="input" rows="1" autocomplete="off" placeholder="메시지" enterkeyhint="send"></textarea>
      <button class="composer__nl" id="composerNl" type="button" aria-label="줄바꿈" title="줄바꿈 (컴퓨터에서는 Shift+Enter)">↵</button>
      <!-- 그림 올리기 (결정 130 ②) — teams/<팀>/in/ 에 저장, 방에 말풍선으로 -->
      <input type="file" id="uploadFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
      <button class="composer__img" id="uploadBtn" type="button" aria-label="그림 올리기" title="그림 올리기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>
      <button class="composer__go" type="submit" aria-label="보내기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </section>

  <!-- 관제탑: 네 팀을 한 화면에. 서브 탭 넷 — 전체(첫 화면) · 팀(카드 다섯) · 개인(열넷 + 대표) · 요청(팀 사이 요청, M3) — 결정 40·50 -->
  <section class="tower" id="tower">
    <header class="tower__head">
      <h1>대시보드</h1>
    </header>
    <!-- 서브탭 글자는 하영 사전(도면 1판 셋째 겹 "사람", 팀↔팀 줄 "요청"). "전체" 와 위 탭 이름 셋은 대표가 0-1 을 고를 때까지 지금 이름 -->
    <nav class="tabs" id="towerTabs" aria-label="대시보드 탭">
      <button type="button" data-tab="all">전체</button>
      <button type="button" data-tab="teams">팀<i class="tabs__n" hidden></i></button>
      <button type="button" data-tab="people">멤버<i class="tabs__n" hidden></i></button>
      <button type="button" data-tab="asks">요청</button>
    </nav>
    <div class="tower__grid" id="towerGrid"></div>
  </section>

  <!-- 대시보드 = "앞으로 언제 뭐가 되나"(나리 정본 · 헨리 시안 1판 dashboard.svg · 결정 128). 위 = 앞날 띠(팀 다섯 줄, 지금 선 오른쪽만) + 대표 답이 있어야 열리는 단계(gated 만 — 결재·대표 차례는 관제탑 ③), 아래 = 1판 예정 작업 표(plan-table.md) -->
  <section class="dashboard" id="dashboard">
    <header class="tower__head">
      <h1>타임라인</h1>
      <!-- 범례 두 줄 — 하영 5판 337행 그대로 · 둘째 줄은 화면 글 틀 1-5(5판 338행에서 뒷말 뺌 — 다섯 줄 중 셋이 둘 다 만든다). 줄기 × 작은 일 표(작업보드-0916)는 34회차 -->
      <p>채움 = 예정 · 점선 = 미정 · 빨강 = 지연<br>점 = 담당자</p>
    </header>
    <div class="dash__body">
      <div class="band" id="dashBand"></div>
      <div class="gates" id="dashGates"></div>
      <div id="dashBody"></div>
    </div>
  </section>

  <!-- 보고서 = "어제 하루가 어땠나"(나리 정본 · 헨리 report 1판 · 결정 80·81). 절은 다섯 — 정하실 것 · 대신 정한 것 · 막힌 것(띠) · 팀마다 한 것 · 오늘 각 방이 먼저 할 일 + 한마디. 절 이름은 경영 틀이 오면 그쪽(5판 3-5-5) -->
  <!-- 리포트 탭은 둘 — 한 장(아침·저녁, 첫째) · 분석(둘째). 둘 다 같은 서브탭 줄(repTabs·anTabs)을 머리에 달고, 속 화면(report·analysis)은 그대로(나리 R32) -->
  <section class="report" id="report">
    <header class="tower__head">
      <h1>리포트 <span class="rep__date" id="repDate"></span></h1>
      <p id="repWindow">어제 18:00 → 오늘 09:00</p>
    </header>
    <nav class="tabs" id="repTabs" aria-label="리포트 탭">
      <button type="button" data-view="report" aria-current="true">일일 보고</button>
      <button type="button" data-view="analysis">분석</button>
    </nav>
    <div class="dash__body" id="repBody"></div>
  </section>

  <!-- 분석: 팀 하나를 깊게 — 리포트의 둘째 탭 -->
  <section class="analysis" id="analysis">
    <header class="tower__head">
      <!-- 분석 1판(헨리 analysis.svg) — 다섯 팀을 같은 자로, 칸 셋. 나리 정본 "왜 자꾸 이렇게 되나" -->
      <h1 id="anTitle">분석</h1>
    </header>
    <nav class="tabs" id="anTabs" aria-label="리포트 탭">
      <button type="button" data-view="report">일일 보고</button>
      <button type="button" data-view="analysis" aria-current="true">분석</button>
    </nav>
    <div class="an__body" id="anBody"></div>
  </section>

  <!-- 설정 — 권한 현황(나리 표 그대로) · 낱말 사전(하영) · 인격 파일 목록. 마을은 맨 아래 '숨김 화면' 링크로만(나리 R32, 카드-체계-0916 4절) -->
  <section class="settings" id="settings">
    <header class="tower__head">
      <h1>설정</h1>
      <p>읽기 전용 — 변경은 파일에서</p>
    </header>
    <div class="dash__body" id="setBody"></div>
  </section>

  <!-- 마을: 도트 마을에서 캐릭터와 말풍선으로 본다 -->
  <section class="world" id="world">
    <header class="world__bar">
      <div><h1>마을</h1><span class="world__hint">방향키 이동 · Enter 대화 · 캐릭터 클릭 = 프로필</span></div>
      <!-- 조작판 (결정 105 — "처음 들어온 사람이 손잡이를 하나도 안 만지고 마을을 볼 수 있는가"). 늘 보이는 건 "어디로 갈까" 한 줄뿐.
           다시 보기·속도·배율·따라가기·시험용 시각은 서랍(wvMore) — 눌러야 열린다. 만들면서 쓰던 줄 다섯이 폰에서 마을을 절반 가렸다. -->
      <div class="world__ctl">
        <span class="world__scene" id="wvScene"><button type="button" data-scene="village">마을</button><button type="button" data-scene="castle">회사</button></span>
        <select id="wvGo" aria-label="어디로"></select>
        <button type="button" id="wvGoBtn">이동</button>
        <span class="world__clock" id="wvClock" title="세상의 시계"></span>
        <button type="button" class="world__more" id="wvMore" aria-expanded="false" aria-controls="wvDrawer" title="다시 보기·속도·배율">더 보기</button>
        <span class="world__status" id="wvStatus"></span>
      </div>
      <div class="world__drawer" id="wvDrawer" hidden>
        <select id="wvTeam" aria-label="다시 볼 팀"></select>
        <select id="wvRound" aria-label="다시 볼 회차"></select>
        <button type="button" id="wvPlay">재생</button>
        <button type="button" id="wvStop" hidden>정지</button>
        <!-- 재생 속도와 화면 배율은 다른 것인데 둘 다 숫자라 헷갈렸다 (결정 13) — 글자로 가른다. -->
        <select id="wvSpeed" aria-label="재생 속도" title="재생 속도 — 사건을 얼마나 빨리 돌리나"><option value="1">1배</option><option value="2" selected>2배</option><option value="4">4배</option></select>
        <select id="wvZoom" aria-label="화면 배율" title="화면 배율 — 얼마나 크게 보나"><option value="1">작게</option><option value="2" selected>보통</option><option value="3">크게</option></select>
        <label><input type="checkbox" id="wvCam" checked> 화자 따라가기</label>
        <select id="wvHour" aria-label="시험용 시각" title="시험용으로 시각을 고정한다. 실제 시각으로 돌리려면 첫 항목"><option value="">실시간</option><option value="9">09:00 출근</option><option value="12">12:00 점심</option><option value="15">15:00 근무</option><option value="19">19:00 퇴근</option><option value="23">23:00 밤</option></select>
      </div>
    </header>
    <div class="world__view" id="wvView">
      <!-- 3D 무대 — draw3d.js 가 WebGL 캔버스와 글 층(CSS2D: 이름표·말풍선·방 이름)을 여기에 넣는다. 끌면 이동, 휠·핀치로 확대. -->
      <div class="world__stage" id="wvStage"></div>
      <form class="world__talk" id="wvTalk" hidden>
        <input id="wvTalkIn" type="text" autocomplete="off">
        <button type="submit">말하기</button>
        <button type="button" id="wvTalkX">닫기</button>
      </form>
      <div class="world__toast" id="wvToast" hidden></div>
    </div>
    <aside class="world__card" id="wvCard" hidden aria-live="polite"></aside>
  </section>

  <!-- 오른쪽: 상황판 -->
  <aside class="side" id="side">
    <div class="side__head">
      <span>상황판</span>
      <button class="iconbtn" id="sideClose" aria-label="닫기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="side__body">
      <!-- 첫 카드: 지금 어디까지 왔나 — teams/<팀>/progress.json (결정 23). 실무가 턴 끝·닫기마다 쓴다. -->
      <section class="card" id="cardProgress"></section>
      <!-- 이 방이 낀 요청 블록 — 요청한 방·받는 방·총괄실 세 곳에 뜬다 (6-1절). 열린 것만, 닫힌 건 관제탑 요청 탭에. -->
      <section class="card" id="cardRequests" hidden></section>
      <section class="card" id="cardRound"></section>
      <section class="card" id="cardRoadmap"></section>
      <section class="card" id="cardCrew"></section>
      <section class="card" id="cardJournal"></section>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
