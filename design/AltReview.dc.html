<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8a6a2f; } a:hover { color: #6b5023; }
    .app { width: 440px; height: 620px; background: #fbfaf8; color: #23211e; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden; }
    .hd { flex: none; padding: 18px 24px 14px; border-bottom: 1px solid #e8e4dd; }
    .hd h1 { margin: 0; font-family: 'Gowun Batang', serif; font-size: 19px; }
    .hd p { margin: 3px 0 0; font-size: 11.5px; color: #8b857b; }
    .doc { flex: 1; padding: 18px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
    .say { display: flex; flex-direction: column; gap: 4px; }
    .say .w { font-family: 'Gowun Batang', serif; font-size: 12.5px; color: #6b655c; }
    .say .m { font-size: 13px; }
    .say.side { border-left: 2px solid #d9d3c8; padding-left: 13px; margin-left: 20px; }
    .say.side .m { color: #6b655c; font-size: 12.5px; }
    .mark { border: 1px solid #c9a86a; background: #fdf8ee; border-radius: 2px; padding: 11px 14px; }
    .mark .k { font-family: 'Gowun Batang', serif; font-size: 13px; color: #8a6a2f; letter-spacing: .05em; }
    .mark .b { font-size: 12.5px; color: #4a443b; margin-top: 4px; }
    .ft { flex: none; padding: 12px 24px; border-top: 1px solid #e8e4dd; color: #a09a90; font-size: 11.5px; }
  </style>
</helmet>
<div class="app">
  <div class="hd">
    <h1>마일스톤 2 — 캠페인 헤드라인</h1>
    <p>라운드 3 · 실무 실행, 내부감사·외부감사 감사</p>
  </div>
  <div class="doc">
    <div class="say">
      <div class="w">실무</div>
      <div class="m">헤드라인 3안 뽑았습니다. 셋 다 같은 약속 하나만 말하도록 맞췄습니다.</div>
    </div>
    <div class="say side">
      <div class="w">내부감사</div>
      <div class="m">2안이 약속을 두 개 하고 있습니다. 어느 쪽입니까?</div>
    </div>
    <div class="say side">
      <div class="w">외부감사</div>
      <div class="m">3안의 "업계 최초"는 근거 문서에 없는 표현입니다.</div>
    </div>
    <div class="mark">
      <div class="k">되돌려보냄</div>
      <div class="b">근거 없는 수치 1건, 중복 약속 1건. 반박 2 / 3</div>
    </div>
    <div class="say">
      <div class="w">대표</div>
      <div class="m">3안 빼고 1안으로 가자</div>
    </div>
  </div>
  <div class="ft">한마디 남기기…</div>
</div>
</x-dc>
</body>
</html>
