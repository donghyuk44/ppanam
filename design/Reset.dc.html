<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0f5b52; } a:hover { color: #0a3f38; }
    .app { width: 460px; height: 940px; display: flex; flex-direction: column; background: #e7e0d3; color: #1c1a17; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden; }
    .bar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 12px; background: #fdfbf7; border-bottom: 1px solid #d6cdbb; }
    .room h1 { margin: 0; font-family: 'Gowun Batang', serif; font-size: 21px; }
    .who { font-size: 11.5px; color: #7a7266; margin-top: 1px; }
    .chip { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: 'Gowun Batang', serif; font-size: 13px; color: #fdfbf7; }
    .roundbar { flex: none; display: flex; align-items: center; gap: 9px; padding: 8px 18px; background: #f4efe4; border-bottom: 1px solid #d6cdbb; font-size: 12.5px; }
    .rnum { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 11px; background: #0f5b52; color: #f4efe4; padding: 2px 7px; border-radius: 4px; letter-spacing: .04em; }
    .rtitle { flex: 1; color: #4a443b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rprog { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a8175; }
    .archived { flex: none; margin: 12px 16px 0; display: flex; align-items: center; justify-content: space-between; background: #ddd4c2; border: 1px solid #cec4b1; border-radius: 8px; padding: 7px 12px; font-size: 11.5px; color: #6b6459; }
    .archived b { font-weight: 600; color: #4a443b; }
    .archived .go { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #0f5b52; display: flex; align-items: center; gap: 4px; }
    .feed { flex: 1; display: flex; flex-direction: column; gap: 11px; padding: 16px 16px 20px; overflow: hidden; }
    .banner { align-self: center; text-align: center; font-size: 12px; padding: 5px 15px; border-radius: 999px; background: #d9d0be; color: #4a443b; }
    .banner.start { background: #0f5b52; color: #f2ede2; font-weight: 600; }
    .pill { align-self: center; font-size: 11.5px; color: #8a8175; }
    .row { display: flex; gap: 9px; align-items: flex-start; }
    .av { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-family: 'Gowun Batang', serif; font-size: 15px; color: #fdfbf7; margin-top: 15px; }
    .stack { display: flex; flex-direction: column; max-width: 318px; min-width: 0; }
    .name { font-size: 11.5px; color: #7a7266; margin: 0 0 3px 2px; }
    .name b { font-weight: 600; color: #514a41; }
    .bub { background: #fdfbf7; border: 1px solid #ded5c4; border-radius: 3px 14px 14px 14px; padding: 9px 13px; white-space: pre-wrap; }
    .quiet { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; color: #9a9184; text-align: center; padding: 0 34px; }
    .quiet__mark { opacity: .45; margin-bottom: 3px; }
    .quiet__t { font-family: 'Gowun Batang', serif; font-size: 15px; color: #7a7266; }
    .quiet__s { font-size: 12px; line-height: 1.6; }
    .quiet code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: #ddd4c2; border-radius: 4px; padding: 1px 5px; color: #5a534a; }
  </style>
</helmet>

<div class="app">
  <header class="bar">
    <div class="room">
      <h1>작전실</h1>
      <div class="who">마케팅팀 · 길잡이, 되짚기, 바깥눈</div>
    </div>
    <div style="display: flex; gap: 5px; align-items: center">
      <div class="chip" style="background: #2f4f7a">길</div>
      <div class="chip" style="background: #a8541f">되</div>
      <div class="chip" style="background: #5b3a63">바</div>
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #2f7d4f; margin-left: 6px"></div>
    </div>
  </header>

  <div class="roundbar">
    <span class="rnum">R4</span>
    <span class="rtitle">마일스톤 3 — 랜딩 상세 카피</span>
    <span class="rprog">3 / 6</span>
  </div>

  <div class="archived">
    <span><b>라운드 3</b> 종료 · PASS · 이벤트 47건 보관됨</span>
    <span class="go">
      기록 보기
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </div>

  <main class="feed">
    <div class="banner start">라운드 4 시작 · 마일스톤 3</div>
    <div class="pill">길잡이, 되짚기, 바깥눈 님이 들어왔습니다</div>

    <div class="row">
      <div class="av" style="background: #2f4f7a">길</div>
      <div class="stack">
        <div class="name"><b>길잡이</b> 오후 3:02</div>
        <div class="bub">마일스톤 3 시작합니다. 통과 조건은 랜딩 상세 카피 초안 1벌 — 섹션 다섯 개 전부요.</div>
      </div>
    </div>

    <div class="quiet">
      <svg class="quiet__mark" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8a8175" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16M4 12h16M4 19h9"/>
      </svg>
      <div class="quiet__t">화면이 비워졌습니다</div>
      <div class="quiet__s">
        라운드가 끝나면 대화는 <code>rounds/</code> 로 옮겨지고<br>
        여기는 다음 마일스톤만 남습니다.
      </div>
    </div>
  </main>

  <footer style="flex: none; display: flex; gap: 9px; padding: 12px 16px 16px; background: #fdfbf7; border-top: 1px solid #d6cdbb">
    <div style="flex: 1; background: #f0ebe0; border: 1px solid #ded5c4; border-radius: 18px; padding: 8px 14px; color: #9a9184; font-size: 13.5px">대표로 한마디 끼어들기…</div>
    <div style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #0f5b52; color: #f2ede2; display: grid; place-items: center">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </div>
  </footer>
</div>
</x-dc>
</body>
</html>
